<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040b">
<title>সিনিয়র সেতু</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI",system-ui,sans-serif;
 color:#fff;background:#05040b
}
.bg{
 position:fixed;inset:0;
 background:
 radial-gradient(circle at 12% 15%,#ff4b9b33,transparent 26%),
 radial-gradient(circle at 88% 78%,#705cff38,transparent 30%),
 linear-gradient(145deg,#05040b,#120819 52%,#05040b)
}
.bg:after{
 content:"";position:absolute;inset:-50%;
 background:linear-gradient(110deg,transparent 42%,#ffffff0b 50%,transparent 58%);
 animation:sweep 8s linear infinite
}
@keyframes sweep{to{transform:translateX(45%)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.wrap{height:100%;display:grid;place-items:center;padding:15px}
.card{
 position:relative;width:min(780px,94vw);height:min(740px,93vh);min-height:520px;
 overflow:hidden;border:1px solid #ffffff25;border-radius:40px;
 background:linear-gradient(145deg,#ffffff1b,#ffffff06);
 backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
 box-shadow:0 35px 120px #000000a8,inset 0 1px #ffffff20
}
.content{
 position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;padding:28px 23px
}
.badge{font-size:13px;letter-spacing:4px;color:#d8d1df;margin-bottom:18px}
h1{margin:0;font-size:clamp(38px,10vw,72px);font-weight:900;
 text-shadow:0 0 35px #ff4b9b55}
.divider{width:100px;height:3px;margin:23px auto;border-radius:9px;
 background:linear-gradient(90deg,#ff4b9b,#7c62ff)}
.lead{max-width:610px;color:#ddd6e4;font-size:clamp(16px,4.4vw,21px);line-height:1.9}
.start{
 margin-top:27px;border:1px solid #ffffff30;border-radius:999px;padding:15px 30px;
 color:#fff;font-size:17px;font-weight:800;background:linear-gradient(135deg,#ff3f91,#735bff);
 box-shadow:0 16px 45px #a844b05c;cursor:pointer;transition:.25s
}
.start:hover{transform:translateY(-4px) scale(1.02)}
#story{display:none}
.text{
 min-height:205px;width:100%;display:grid;place-items:center;
 font-size:clamp(21px,5.6vw,36px);font-weight:700;line-height:1.8
}
.cursor{border-right:2px solid #fff;animation:blink .7s infinite}
@keyframes blink{50%{border-color:transparent}}
.quote{
 max-width:650px;color:#ece5f0;font-size:clamp(17px,4.6vw,23px);
 line-height:1.9;margin-top:4px
}
.signature{margin-top:10px;color:#aaa1b2;font-size:13px}
.magic{display:none;position:relative;width:100%;height:190px;align-items:center;justify-content:center}
.magic.show{display:flex}
.nums{display:flex;gap:14px;z-index:4}
.num{
 font-family:Arial,sans-serif;font-size:clamp(64px,18vw,108px);font-weight:950;
 text-shadow:0 0 14px #fff9,0 0 45px #ff43a0c9;
 animation:bounce 1.08s cubic-bezier(.18,.9,.25,1.25) infinite
}
.num:nth-child(2){animation-delay:.14s}.num:nth-child(3){animation-delay:.28s}
@keyframes bounce{
 0%,100%{transform:translateY(20px) scale(.9)}
 45%{transform:translateY(-62px) scale(1.16)}
 70%{transform:translateY(-3px) scale(1)}
}
.spark{
 position:absolute;font-size:21px;opacity:0;animation:rise 2.8s ease-out forwards;
 filter:drop-shadow(0 0 9px #ff5aaa)
}
@keyframes rise{
 0%{transform:translateY(25px) scale(.3);opacity:0}
 15%{opacity:1}
 100%{transform:translateY(-185px) scale(1.3) rotate(190deg);opacity:0}
}
.answer{
 margin-top:8px;text-decoration:none;color:#fff;padding:14px 26px;border-radius:999px;
 border:1px solid #ffffff2b;background:#ffffff12;font-weight:800
}
.answer:hover{background:#ffffff22}
.note{font-size:12px;color:#9f98aa;margin-top:12px}
.progress{position:absolute;z-index:7;left:25px;right:25px;bottom:18px;height:3px;border-radius:9px;background:#ffffff12}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ff4597,#8161ff);transition:.7s}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx"></canvas>

<div class="wrap">
<main class="card">
<section class="content" id="intro">
 <div class="badge">বিশেষ একটি বার্তা</div>
 <h1>সিনিয়র সেতু</h1>
 <div class="divider"></div>
 <div class="lead">কিছু কথা আছে—আজ একটু অন্যভাবে বলা যাক। ধীরে ধীরে পড়বেন, কারণ শেষটায় একটি ছোট্ট চমক আছে।</div>
 <button class="start" id="start">শুরু করি ✨</button>
</section>

<section class="content" id="story">
 <div class="text" id="text"></div>
 <div class="quote" id="quote"></div>
 <div class="signature" id="signature"></div>
 <div class="magic" id="magic">
  <div class="nums"><span class="num">1</span><span class="num">4</span><span class="num">3</span></div>
 </div>
 <a class="answer" href="https://m.me/si.md.atikul.islam" target="_blank" rel="noopener">উত্তরটি Messenger-এ জানান</a>
 <div class="note">নিজের মতামত নিজের মতো করে জানাতে পারেন।</div>
</section>
<div class="progress"><div class="bar" id="bar"></div></div>
</main>
</div>

<script>
const c=document.getElementById("fx"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,particles=[];
function resize(){
 W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
 c.style.width=W+"px";c.style.height=H+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)
}
addEventListener("resize",resize);resize();

const glyphs=["✦","✧","❀","✿","🌸","💫","♡"];
function rain(n){
 for(let i=0;i<n;i++)particles.push({
  x:Math.random()*W,y:-20-Math.random()*H*.5,s:12+Math.random()*22,
  v:1+Math.random()*2.5,r:Math.random()*6.28,vr:(Math.random()-.5)*.08,
  d:(Math.random()-.5)*.8,g:glyphs[Math.floor(Math.random()*glyphs.length)],
  a:.5+Math.random()*.5
 })
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.textAlign="center";ctx.textBaseline="middle";
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];p.y+=p.v;p.x+=Math.sin(p.y*.012)*p.d;p.r+=p.vr;
  ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.r);
  ctx.font=p.s+"px sans-serif";ctx.fillText(p.g,0,0);ctx.restore();
  if(p.y>H+50)particles.splice(i,1)
 }
 requestAnimationFrame(draw)
}
draw();

const lines=[
 "সিনিয়র সেতু, আজকের কথাগুলো একটু মন দিয়ে পড়বেন…",
 "কিছু মানুষকে আলাদা করে সম্মান করা যায়—কোনো বড় কারণ ছাড়াই।",
 "আপনার জন্যও তেমনই কিছু সুন্দর কথা জমে আছে।",
 "আর শেষ পর্যন্ত গেলে ছোট্ট একটা চমক অপেক্ষা করছে।"
];
const quote="“সুন্দর কথা হৃদয়কে হালকা করে, আর আন্তরিকতা মানুষকে কাছে আনে।”";
const sleep=m=>new Promise(r=>setTimeout(r,m));
const intro=document.getElementById("intro"),story=document.getElementById("story");
const text=document.getElementById("text"),q=document.getElementById("quote");
const sig=document.getElementById("signature"),magic=document.getElementById("magic"),bar=document.getElementById("bar");

async function typeLine(v,i){
 text.innerHTML="";
 const s=document.createElement("span");s.className="cursor";text.appendChild(s);
 for(const ch of v){s.textContent+=ch;await sleep(ch===" "?18:55)}
 s.classList.remove("cursor");bar.style.width=((i+1)/lines.length*68)+"%";
 await sleep(650)
}
function burst(){
 for(let i=0;i<30;i++)setTimeout(()=>{
  const s=document.createElement("div");s.className="spark";
  s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
  s.style.left=30+Math.random()*40+"%";s.style.top=47+Math.random()*20+"%";
  document.body.appendChild(s);setTimeout(()=>s.remove(),4000)
 },i*48)
}
document.getElementById("start").onclick=async()=>{
 intro.style.display="none";story.style.display="flex";rain(170);
 for(let i=0;i<lines.length;i++)await typeLine(lines[i],i);
 text.innerHTML="";
 q.textContent=quote;
 sig.textContent="— একটি ছোট্ট আন্তরিক বার্তা";
 bar.style.width="100%";
 await sleep(1100);
 magic.classList.add("show");burst();rain(190);
 setInterval(burst,2200)
}
</script>
</body>
</html>
